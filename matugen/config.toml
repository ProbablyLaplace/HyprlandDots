[config]

[config.wallpaper]
command = "swww"
arguments = ["img", "--transition-type", "wipe"]  # Optional: add transition effects
set = true



[templates.hyprland]
input_path = '~/.config/matugen/templates/hypr-colors.conf'
output_path = '~/.cache/matugen/hypr-colors.conf'
post_hook = "hyprctl reload"

[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.conf'
output_path = '~/.config/kitty/colors.conf'
post_hook = 'pkill -SIGUSR1 kitty'




[templates.qolors]
input_path = "~/.config/matugen/templates/colors.json"
output_path = "~/.local/state/quickshell/colors.json"
